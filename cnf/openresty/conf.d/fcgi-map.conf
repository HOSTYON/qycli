# GLOBAL METHOD CHECK
map $request_method $skip_cache_method {
    POST        1;
    default     0;
}

# AJAX / XHR REQUESTS CHECKS
map $http_x_requested_with $skip_cache_xhr {
    XMLHttpRequest 1;
    default        0;
}

# ADVANCED URI EXCEPTIONS (WordPress, WooCommerce, Laravel & Localization)
map $request_uri $skip_cache_uri {
    # Core Administrative & System Rules
    ~*"/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml"    1;
    ~*"/wp-comments-popup.php|/wp-links-opml.php|/embed"                          1;
    
    # WooCommerce & E-Commerce Core Routes (En/Fr)
    ~*"/add_to_cart/|/cart/|/panier/|/checkout/|/commande/|/addons/"              1;
    ~*"/account/|/my-account/|/mon-compte/|/lost-password/|/resetpass/|/logout/"  1;
    ~*"/wc-api/*|/edd-sl/*"                                                       1;
    
    # Laravel System Rules
    ~*"/api/|/nova/|/horizon/|/nova-api/"                                         1;
    
    default                                                                       0;
}

# EXTENDED COOKIE EXCEPTIONS
map $http_cookie $skip_cache_cookie {
    # WordPress & WooCommerce System Cookies
    ~*"comment_author|wordpress_[a_f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in"  1;
    ~*"comment_author_email_|edd_items_in_cart|edd"                                            1;
    ~*"woocommerce_items_in_cart|woocommerce_cart_hash"                                        1;
    ~*"wptouch_switch_toggle|wptouch_switch_toogle"                                            1;
    
    # Laravel Sessions
    ~*"laravel_session|XSRF-TOKEN"                                                             1;
    
    default                                                                                    0;
}

# SMART MARKETING QUERY STRING EXCLUSION ENGINE
map $args $skip_cache_query {
    ""          0;  # No arguments? Safe to cache.
    ~*^utm_     0;  # Google Analytics tags? Safe to cache!
    ~*fbclid    0;  # Facebook Click Identifiers? Safe to cache!
    default     1;  # Any other dynamic application search/query? Skip cache.
}
