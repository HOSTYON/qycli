# CORE SYSTEM PATHS

# Optimized Favicon Handling
location = /favicon.ico {
    # If your platform forces a custom fallback path, look there first, else return an empty pixel without disk thrashing
    try_files /wp-content/uploads/fbrfg/favicon.ico @empty_gif;
    access_log off;
    log_not_found off;
    expires max;
}

location @empty_gif {
    empty_gif;
}

# Dynamic Robots Handling
location = /robots.txt {
    try_files $uri $uri/ /index.php?$args @robots;
    access_log off;
    log_not_found off;
}

location @robots {
    return 200 "User-agent: *\nDisallow: /wp-admin/\nAllow: /wp-admin/admin-ajax.php\n";
}


# ADVANCED HARDENING & SECURITY

# Protect Sensitive Corporate & Repository Meta Files (Fixed Regex Syntax)
location ~* /(readme|license|example|legalnotice|installation|changelog)\.(txt|html|md)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block Explicitly Malicious Upload Directory Executions (Consolidated)
# Prevents any PHP generation inside uploads or multisite files
location ~* /(?:uploads|files|wp-content/uploads)/.*\.php$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Protect Global Configuration Source Spills
location ~* /(wp-config\.txt|wp-config\.bak|wp-config\.old|\.ht) {
    deny all;
    access_log off;
    log_not_found off;
}

# Global Hidden File Protection (Excluding Let's Encrypt / ACME validation paths)
location ~ /\.(?!well-known\/) {
    deny all;
    access_log off;
    log_not_found off;
}

# Block Base64 Web Shell Exploit Injections
location ~* "(base64_encode)(.*)(\()" {
    deny all;
}
