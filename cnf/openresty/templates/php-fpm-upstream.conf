upstream phpMICROVER-fpm {
    # Path to the local PHP-FPM socket
    server unix:/run/php/SHORTVER/php-fpm.sock;
    
    # Keep up to 256 idle connections open to PHP workers per OpenResty process
    keepalive 256;
    
    # Recycle the connection after a large number of requests to prevent memory leaks
    keepalive_requests 10000;
    
    # Clear out idle connections relatively fast if traffic completely stops
    keepalive_timeout 60s;
}