location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

location ~ [^/]\.php(/|$) {
    # Isolate the script name cleanly
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;

    # Single check: Ensure ONLY the isolated script file exists before passing upstream
    try_files $fastcgi_script_name =404;
    
    # Environment Profiles
    include fastcgi_params;
    include fastcgi_qycli_params;
    
    # Symmetrical Buffer Matching
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;
    
    # Upstream Processing Track
    fastcgi_pass phpMICROVER-fpm;
}
