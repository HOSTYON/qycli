[qycli]
user = unyphp
group = unyphp

ping.path = /ping

pm = static
pm.max_children = 2
pm.status_path = /status
pm.max_requests = 2048

request_terminate_timeout = 900

chdir = /
prefix = /run
listen = php-fpm.sock
listen.owner = unyweb
listen.group = unyweb
listen.mode = 0660
listen.backlog = 32768

catch_workers_output = yes